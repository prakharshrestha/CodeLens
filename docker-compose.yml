version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codelens_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: codelens_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codelens_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelens_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codelens_db
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-prakharshrestha}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8090}
      JENKINS_USERNAME: ${JENKINS_USERNAME:-admin}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://host.docker.internal:2375}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codelens_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelens_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend
    networks:
      - codelens_network

volumes:
  postgres_data:

networks:
  codelens_network:
    driver: bridge
